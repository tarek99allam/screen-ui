[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-ui"
version = "0.1.0"
description = "Modern GTK4/Libadwaita GUI wrapper for GNU screen and embedded serial debugging with smart log highlighting, pause/buffering, baudrate auto-detection, and instant screenshots."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "tarek99allam"}
]
keywords = ["serial", "screen", "embedded", "uart", "ttyUSB", "gtk4", "libadwaita", "esp32", "firmware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Terminals :: Serial",
]
dependencies = [
    "pyserial>=3.5",
    "PyGObject>=3.42",
]

[project.scripts]
screen-UI = "screen_ui.cli:main"
screen-ui = "screen_ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["screen_ui*"]
